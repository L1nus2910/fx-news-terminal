name: 経済指標を取得

on:
  workflow_dispatch:
  schedule:
    # 15分ごとに起動し、1回の実行の中で約14分間くり返し取得する
    - cron: "*/15 * * * *"

permissions:
  contents: write   # data ブランチへの書き込み

concurrency:
  group: economic-calendar
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: data ブランチを準備
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir data-out && cd data-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin data; then
            git checkout -q -B data FETCH_HEAD
          else
            git checkout -q --orphan data
          fi

      - name: 経済指標を取得して公開（約14分間）
        env:
          DATA_DIR: data-out
          RUN_SECONDS: ${{ github.event_name == 'schedule' && '840' || '60' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS: ${{ vars.TELEGRAM_ALERTS || 'on' }}
        run: python scripts/fetch_calendar.py
