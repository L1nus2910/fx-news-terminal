name: 公式ニュースを取得

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: read

concurrency:
  group: fetch-official-news
  cancel-in-progress: false

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 公式RSSを取得して保存
        run: python scripts/fetch_news.py
        env:
          SUPABASE_URL: https://swmbphjtvtkjrnvkytxw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
